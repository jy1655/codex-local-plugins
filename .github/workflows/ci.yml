name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python tests
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -q

  javascript:
    # The security validators require POSIX no-follow/nonblocking file-open flags.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run JavaScript tests
        run: >-
          node --test
          plugins/jy-env-core/skills/security-audit/validate-findings.test.cjs
          plugins/jy-env-core/skills/security-audit/validate-coverage-ledger.test.cjs
          plugins/jy-env-core/skills/pstack/references/skills/poteto-mode/scripts/check-plan.test.mjs
