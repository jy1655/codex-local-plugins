schema_version = 1
name = "jy-portable-codex"

[[plugins]]
name = "jy-env-core"
source = "plugins/jy-env-core"
install_mode = "symlink"
installation_policy = "INSTALLED_BY_DEFAULT"

[[plugins]]
name = "jy-env-planning"
source = "plugins/jy-env-planning"
install_mode = "symlink"
installation_policy = "AVAILABLE"

[[plugins]]
name = "jy-env-delivery"
source = "plugins/jy-env-delivery"
install_mode = "symlink"
installation_policy = "AVAILABLE"

[[plugins]]
name = "jy-env-audit"
source = "plugins/jy-env-audit"
install_mode = "symlink"
installation_policy = "AVAILABLE"

[[plugins]]
name = "jy-env-ios"
source = "plugins/jy-env-ios"
install_mode = "symlink"
installation_policy = "AVAILABLE"

[[instructions]]
name = "global-agents"
source = "instructions/AGENTS.md"
target = ".codex/AGENTS.md"
install_mode = "symlink"

[platform_overrides.windows]
plugin_install_mode = "copy"
instruction_install_mode = "copy"
